name: Feature request
description: Suggest a new assertion type, output format, or integration
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would the solution look like?
      placeholder: A new action type "expect_visible" that checks element visibility...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
