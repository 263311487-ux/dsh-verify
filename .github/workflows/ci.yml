name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: engine self-tests
        run: npm test

      - name: fixed build must PASS
        run: npm run demo:fixed

      - name: buggy build must fail for the missing style
        run: node scripts/check-buggy.mjs

      - name: packed CLI smoke
        run: node scripts/smoke-pack.mjs
