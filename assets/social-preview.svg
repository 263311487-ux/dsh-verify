<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c12"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <filter id="pass-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="3" height="640" fill="#4facfe" opacity="0.7"/>

  <!-- TOP: Tag line -->
  <rect x="64" y="64" width="180" height="28" rx="4" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="76" y="82" font-size="11" fill="#4facfe" letter-spacing="2" font-weight="700">TESTING · CI · MCP</text>

  <!-- MAIN TITLE -->
  <text x="64" y="170" font-size="88" fill="#ffffff" font-weight="700" letter-spacing="-3">dsh-verify</text>
  <text x="66" y="208" font-size="18" fill="#4facfe" letter-spacing="1" opacity="0.8">// Witness — the browser is the judge</text>

  <!-- BIG TAGLINE — the money line -->
  <text x="64" y="278" font-size="26" fill="#e2e8f0" font-weight="400" letter-spacing="-0.5">You asked an AI to build a web app.</text>
  <text x="64" y="316" font-size="26" fill="#e2e8f0" font-weight="400" letter-spacing="-0.5">It said <tspan fill="#f7c35f" font-weight="700">done.</tspan>  Does it actually <tspan fill="#22c55e" font-weight="700">work?</tspan></text>

  <!-- Divider -->
  <line x1="64" y1="348" x2="560" y2="348" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- ASSERTION LIST — simplified, bigger, readable at thumb -->
  <text x="64" y="380" font-size="14" fill="#64748b" letter-spacing="1">BROWSER ASSERTIONS</text>

  <!-- Row 1 PASS -->
  <rect x="64" y="394" width="52" height="22" rx="3" fill="#22c55e" fill-opacity="0.15"/>
  <text x="72" y="409" font-size="12" fill="#22c55e" font-weight="700">PASS</text>
  <text x="128" y="409" font-size="13" fill="#94a3b8">click #dark-toggle → body.dark class present</text>

  <!-- Row 2 PASS -->
  <rect x="64" y="424" width="52" height="22" rx="3" fill="#22c55e" fill-opacity="0.15"/>
  <text x="72" y="439" font-size="12" fill="#22c55e" font-weight="700">PASS</text>
  <text x="128" y="439" font-size="13" fill="#94a3b8">expect_text #counter → "Clicked: 3"</text>

  <!-- Row 3 FAIL — the key example -->
  <rect x="64" y="454" width="52" height="22" rx="3" fill="#ef4444" fill-opacity="0.15"/>
  <text x="72" y="469" font-size="12" fill="#ef4444" font-weight="700">FAIL</text>
  <text x="128" y="469" font-size="13" fill="#94a3b8">background-color unchanged — .dark rule missing</text>

  <!-- Key insight -->
  <text x="64" y="510" font-size="13" fill="#64748b">Agent self-review: ✓ passed    Real browser: ✗ caught</text>

  <!-- Bottom stats line -->
  <text x="64" y="568" font-size="12" fill="#475569">CLI · MCP server · GitHub Action · Visual regression · Multi-browser</text>

  <!-- RIGHT SIDE: Big verdict -->
  <!-- Verdict background glow -->
  <rect x="720" y="0" width="560" height="640" fill="url(#glow-green)"/>

  <!-- Verdict box -->
  <rect x="800" y="180" width="360" height="200" rx="8" fill="#0d1117" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="800" y="180" width="360" height="200" rx="8" fill="#22c55e" fill-opacity="0.03"/>

  <!-- PASS text -->
  <text x="980" y="300" font-size="96" fill="#22c55e" font-weight="700" text-anchor="middle" filter="url(#pass-glow)">PASS</text>

  <!-- Stats under verdict -->
  <text x="800" y="420" font-size="14" fill="#22c55e" opacity="0.7">10 / 10 assertions</text>
  <text x="980" y="420" font-size="14" fill="#94a3b8" text-anchor="middle">1.24s</text>
  <text x="1160" y="420" font-size="14" fill="#4facfe" text-anchor="end">Chromium</text>

  <!-- Domain tag -->
  <text x="980" y="500" font-size="12" fill="#475569" text-anchor="middle" letter-spacing="1">github.com/263311487-ux/dsh-verify</text>

  <!-- Version badge -->
  <rect x="900" y="540" width="160" height="26" rx="4" fill="#1e293b"/>
  <text x="980" y="557" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">npm install dsh-verify</text>
</svg>