<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin: 12px 0 4px; }
  input { padding: 8px; width: 100%; box-sizing: border-box; }
  .err { color: #c00; font-size: 13px; min-height: 16px; display: block; }
  #submit { margin-top: 16px; padding: 10px 24px; }
  #success { color: #0a7d33; font-weight: 700; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <h1>Sign up</h1>
  <form id="signup" novalidate>
    <label for="name">Name</label>
    <input id="name" type="text">
    <span class="err" id="err-name"></span>
    <label for="email">Email</label>
    <input id="email" type="email">
    <span class="err" id="err-email"></span>
    <label for="password">Password</label>
    <input id="password" type="password">
    <span class="err" id="err-password"></span>
    <button id="submit" type="submit">Sign up</button>
  </form>
  <div id="success"></div>
<script>
  const nameEl = document.getElementById("name");
  const emailEl = document.getElementById("email");
  const passEl = document.getElementById("password");
  const errName = document.getElementById("err-name");
  const errEmail = document.getElementById("err-email");
  const errPass = document.getElementById("err-password");
  const success = document.getElementById("success");
  document.getElementById("signup").addEventListener("submit", e => {
    e.preventDefault();
    let ok = true;
    success.style.display = "none";
    const name = nameEl.value.trim();
    const email = emailEl.value.trim();
    const pass = passEl.value;
    if (!name) { errName.textContent = "Name is required"; ok = false; } else { errName.textContent = ""; }
    const emailOk = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
    if (!email || !emailOk) { errEmail.textContent = "Enter a valid email address"; ok = false; } else { errEmail.textContent = ""; }
    if (pass.length < 8) { errPass.textContent = "Password must be at least 8 characters"; ok = false; } else { errPass.textContent = ""; }
    if (ok) {
      success.textContent = "Account created";
      success.style.display = "block";
    }
  });
  nameEl.addEventListener("input", () => { errName.textContent = ""; });
  emailEl.addEventListener("input", () => { errEmail.textContent = ""; });
  passEl.addEventListener("input", () => { errPass.textContent = ""; });
</script>
</body>
</html>
